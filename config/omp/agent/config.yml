setupVersion: 1
modelRoles:
  default: ollama/glm-5.2:cloud
theme:
  dark: anthracite
symbolPreset: nerd
colorBlindMode: false
terminal:
  showProgress: true
memory:
  backend: mnemopi
defaultThinkingLevel: auto
display:
    hideToolActivity: true
    shimmer: classic
    showTokenUsage: true
hideThinkingBlock: true
omitThinking: true
statusLine:
    compactThinkingLevel: false
    leftSegments:
        - pi
        - model
        - mode
        - path
        - subagents
        - time_spent
    preset: custom
    rightSegments:
        - token_in
        - token_out
        - token_rate
        - cost
        - context_pct
    segmentOptions:
        git:
            showBranch: true
            showStaged: true
            showUnstaged: true
            showUntracked: true
        model:
            showThinkingLevel: true
        path:
            abbreviate: true
            maxLength: 60
        time:
            format: 24h
            showSeconds: true
    separator: slash
    sessionAccent: false
    showHookStatus: true
    transparent: false
task:
    showResolvedModelBadge: false
todo:
    eager: default
    remindersMax: 5
tui:
    hyperlinks: always
    scrollbackRebuild: true
    textSizing: true
    tight: false
vault:
    enabled: true
